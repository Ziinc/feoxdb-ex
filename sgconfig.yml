# ast-grep configuration (https://ast-grep.github.io/)
#
# These rules exist to catch two Rust-side risk patterns that have bitten
# this codebase before at review/CI time, before they land on `main`:
#
#   1. `rule-nif-missing-schedule.yml` — a `#[rustler::nif(...)]` function
#      that does not declare an explicit `schedule = "..."` attribute.
#      Rustler silently defaults unscheduled NIFs to normal (non-dirty)
#      scheduling, which is dangerous for any NIF whose underlying
#      `FeoxStore` call can block (disk I/O, large scans, etc.) since it
#      can stall the whole BEAM scheduler thread. `flush`/`range` already
#      opt into `schedule = "DirtyIo"` — new NIFs should make the same
#      scheduling decision explicit rather than relying on the default.
#
#   2. `rule-no-unwrap-expect-in-nif.yml` — `.unwrap()` / `.expect(...)`
#      calls in `native/feoxdb_nif/src/`. A panic unwinding out of a NIF
#      call is a known risk in this codebase (see the comment on
#      `StoreResource`'s `RefUnwindSafe` impl in store.rs); NIF code
#      should convert errors to `Result`/`NifResult` instead of panicking.
#
# Known pre-existing findings at the time these rules were added (see PR
# description for details): several `#[rustler::nif]` functions in
# store.rs predate this rule and do not yet specify `schedule`, and there
# is one pre-existing `.expect(...)` in `owned_binary` (store.rs). These
# are flagged intentionally so they can be triaged, but are not blockers
# for this PR.
ruleDirs:
  - rules
